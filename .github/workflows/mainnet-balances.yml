name: mainnet-balances

# Read-only. Prints SOL + UP across the deployer, treasury, contract, and pool,
# and what is withdrawable vs locked. Spends nothing, sends no transactions.
on:
  workflow_dispatch:
    inputs:
      rpc:
        description: "Mainnet RPC URL (used only if MAINNET_RPC secret is unset)"
        default: "https://api.mainnet-beta.solana.com"

jobs:
  balances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        working-directory: scripts
        run: npm ci
      - name: Balances
        working-directory: scripts
        env:
          RPC: ${{ secrets.MAINNET_RPC || github.event.inputs.rpc }}
        run: |
          npx tsx balances.ts "$RPC" \
            95QG7JnaYEdY8ZzuGnP7qkHfDVphH4cB8YL4pKMDTtup \
            CsJ8oiDAKQQeYBMBewtLR3oJYbm8BmSS2KB9JZaFFooX \
            58VHcHT2hwKsd7iwB2Z6FvBayWgDmEBcm1wbTaRLm5f5 \
            HqLYyDU1e3ELNvAckX4TkDXxmQ32Mi2WLuNfP6h8LaBE
